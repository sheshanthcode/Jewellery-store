  <style>
  *{
    margin: 0px;
    padding: 0px;
  }
  body{
    display:flex;
   background-color:#1B4332;
  }
    .left{
      margin-top: 20px;
      font-family: Sans-Serif;
      font-weight: bold;
      text-align: center;
      width: 67%;
    }
    .heading{
      display: flex;
      gap: -10px;
      margin-left: 66px;
    }
    .logo{
      width:240px;
      margin-top: -25px;
      margin-right: -60px;

    }
    .s1{
     font-family:  'Bodoni Moda' ;
     font-size:55px;
     font-weight:800px;
     color:#FFFFFF;
     margin-top:20px;
     text-align:center;
    }
    .products{
      display: grid;
      grid-template-columns: auto auto auto ;
      margin-top: 0px;
    }
    .product{
      display:flex ;
      flex-direction: column ;
      gap:2px;
      width: 190px;
      background-color:#FFFFF0;
      align-items: center;
      justify-content: space-between; 
      font-family: Sans-Serif;
      font-weight: bold;
      padding: 20px;
      border-radius: 10px;
      margin: 10px 5px;
      box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
      transition: all 0.4s ease ;
      }
      .product:hover{
        background-color:#FFFFFF;
        cursor: pointer;
      }
    .img1{
      width: 150px;
    }
    .add{
      font-family: Sans-Serif;
      font-weight: bold;
      padding:5px 15px;
      background-color:#1B4332;
      color: #FFFFFF;
      margin-top: 5px;
      border: none;
      border-radius: 4px;
      transition: all 0s ease ;
    }
    .add:hover{
        background-color:#004D40;
        cursor: pointer;
      }
    
    .s2{
      font-size: 20px;
    }
    .cart{
      font-family: Sans-Serif; 
      font-weight: bold;
      background-color: #F8F7F4;
      width: 32%;
      text-align:center;
      position: fixed;
      right: 0px;
      bottom: 0px;
      top: 0px;
      margin:10px 10px;
      padding-top: 20px;
      border-radius: 20px;
      box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
    }
    .total{
      background-color: black;
      color: white;
      margin: 10px 15px;
      padding:7px;
      border-radius: 5px;
    }
    /* Laptop */
@media screen and (max-width: 1200px){
    .products{
        grid-template-columns: auto auto auto;
        justify-content: center;
    }
}

/* Tablet */
@media screen and (max-width: 992px){
    .products{
        grid-template-columns: auto auto auto;
        justify-content: center;
    }

    .cart{
        width: 35%;
    }

    .left{
        width: 65%;
    }
}

/* Mobile */
@media screen and (max-width: 768px){

    body{
        flex-direction: column;
    }

    .left{
        width: 100%;
    }

    .cart{
        position: static;
        width: 95%;
        margin: 20px auto;
    }

    .heading{
        flex-direction: column;
        align-items: center;
        margin-left: 0;
    }

    .logo{
        width: 180px;
        margin: 0;
    }

    .s1{
        font-size: 32px;
    }

    .products{
        grid-template-columns: auto;
        justify-content: center;
    }
}
  </style>

    function displayProducts(){
      let productDiv = document.getElementById("products");
      productDiv.innerHTML ="";
      products.forEach((product)=>{
        let productContainer = document.createElement("div");
        productContainer.classList.add("product");
        productContainer.innerHTML =`
        <img src="images/${product.image}"  class="img1">
       <p class="p1"> ${product.name}</p>
       <p class="p2">${product.price} </p>
       <button class="add">Add to Cart</button>
        `;
        productDiv.appendChild(productContainer);
      });
    }
